name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  flutter-sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare sample helper files
        working-directory: clients/flutter/example
        run: sh prepare.sh
      - name: Install Flutter sample dependencies
        working-directory: clients/flutter/example
        run: flutter pub get
      - name: Analyze Flutter sample
        working-directory: clients/flutter/example
        run: flutter analyze lib test/gateway_samseer_test.dart
      - name: Test plaintext inspector integration
        working-directory: clients/flutter/example
        run: flutter test test/gateway_samseer_test.dart
      - name: Test Alice sample selection
        working-directory: clients/flutter/example
        run: flutter test test/gateway_samseer_test.dart --dart-define=INSPECTOR=alice --plain-name "sample opens with setup instructions and three request buttons"

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [ 24.x, 26.x ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:check

      - name: Build application
        run: npm run build

      - name: Run unit tests
        run: npm test -- --runInBand

      - name: Run client SDK tests
        run: npm run test:clients

      - name: Verify documented request and response examples
        run: node scripts/show-examples.js --json > /dev/null

      - name: Run E2E tests
        run: npm run test:e2e -- --runInBand
