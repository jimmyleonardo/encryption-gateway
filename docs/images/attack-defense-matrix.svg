<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="980" viewBox="0 0 1280 980" role="img" aria-labelledby="title desc">
  <title id="title">Mobile API Security: Threat Model and Defense Layers</title>
  <desc id="desc">Visual comparison of standard TLS, transport SSL pinning, gateway payload encryption, and the limits of these controls against device memory attacks.</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #0f172a; }
      .header-title { font-size: 30px; font-weight: 800; fill: #0f172a; }
      .header-desc { font-size: 17px; fill: #475569; }
      .card-title { font-size: 19px; font-weight: 700; fill: #1e293b; }
      .table-header { font-size: 16px; font-weight: 700; fill: #334155; }
      .table-text { font-size: 15px; fill: #1e293b; }
      .table-subtext { font-size: 13px; fill: #64748b; }
      .badge-text { font-size: 13px; font-weight: 700; text-anchor: middle; }
      .center { text-anchor: middle; }
      .bold { font-weight: 700; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1280" height="980" rx="24" fill="#f8fafc"/>

  <!-- Top Header Section -->
  <text x="48" y="56" class="header-title">Mobile API Security: Threat Model &amp; Defense Layers</text>
  <text x="48" y="88" class="header-desc">Understanding protection boundaries across network transport, application payload, and device memory.</text>

  <!-- Overview Cards: 3 Architecture Tiers -->
  <!-- Tier 1: Standard App -->
  <rect x="48" y="118" width="370" height="152" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="64" y="136" width="104" height="26" rx="6" fill="#f1f5f9"/>
  <text x="116" y="154" class="badge-text" fill="#475569">TIER 1 • BASELINE</text>
  <text x="64" y="188" class="card-title">Standard HTTPS</text>
  <text x="64" y="214" class="table-text">Protects data against public Wi-Fi eavesdropping.</text>
  <text x="64" y="244" class="table-subtext bold" fill="#dc2626">Vulnerable: Custom CA interception (Burp/Charles)</text>

  <!-- Tier 2: SSL Pinning Only -->
  <rect x="455" y="118" width="370" height="152" rx="16" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
  <rect x="471" y="136" width="144" height="26" rx="6" fill="#eff6ff"/>
  <text x="543" y="154" class="badge-text" fill="#1d4ed8">TIER 2 • TRANSPORT PIN</text>
  <text x="471" y="188" class="card-title">HTTPS + SSL Pinning</text>
  <text x="471" y="214" class="table-text">Validates server certificate / SPKI hash.</text>
  <text x="471" y="244" class="table-subtext bold" fill="#ea580c">Vulnerable: In-app pinning hook bypass (Frida)</text>

  <!-- Tier 3: Gateway payload encryption -->
  <rect x="862" y="118" width="370" height="152" rx="16" fill="#ffffff" stroke="#86efac" stroke-width="2.5"/>
  <rect x="878" y="136" width="210" height="26" rx="6" fill="#dcfce7"/>
  <text x="962" y="154" class="badge-text" fill="#15803d">TIER 3 • PAYLOAD ENCRYPTION</text>
  <text x="878" y="188" class="card-title">HTTPS + Encryption Gateway</text>
  <text x="878" y="214" class="table-text">TLS transport plus AES-GCM/RSA payload encryption.</text>
  <text x="878" y="244" class="table-subtext bold" fill="#16a34a">Protects payloads in transit; app memory remains exposed</text>

  <!-- Attack Vector Comparison Matrix Table -->
  <rect x="48" y="294" width="1184" height="430" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Table Header Row -->
  <rect x="48" y="294" width="1184" height="52" rx="18" fill="#f1f5f9"/>
  <text x="74" y="326" class="table-header">ATTACK VECTOR / THREAT</text>
  <text x="485" y="326" class="table-header center">TIER 1 (HTTPS ONLY)</text>
  <text x="750" y="326" class="table-header center">TIER 2 (SSL PINNING)</text>
  <text x="1060" y="326" class="table-header center">TIER 3 (GATEWAY)</text>

  <!-- Row 1: Wi-Fi Sniffing / Custom CA -->
  <line x1="48" y1="346" x2="1232" y2="346" stroke="#f1f5f9" stroke-width="1.5"/>
  <text x="74" y="380" class="table-text bold">1. Public Sniffing / Rogue CA</text>
  <text x="74" y="402" class="table-subtext">Attacker installs trusted CA on device or proxy</text>

  <rect x="420" y="366" width="130" height="34" rx="8" fill="#fee2e2"/>
  <text x="485" y="388" class="badge-text" fill="#991b1b">EXPOSED</text>

  <rect x="685" y="366" width="130" height="34" rx="8" fill="#dcfce7"/>
  <text x="750" y="388" class="badge-text" fill="#166534">BLOCKED (TLS drop)</text>

  <rect x="995" y="366" width="130" height="34" rx="8" fill="#dcfce7"/>
  <text x="1060" y="388" class="badge-text" fill="#166534">BLOCKED (TLS + Cipher)</text>

  <!-- Row 2: Frida SSL Pinning Bypass -->
  <line x1="48" y1="428" x2="1232" y2="428" stroke="#f1f5f9" stroke-width="1.5"/>
  <text x="74" y="462" class="table-text bold">2. Dynamic SSL Pinning Bypass</text>
  <text x="74" y="484" class="table-subtext">Attacker hooks TrustManager to force proxy pass</text>

  <rect x="420" y="448" width="130" height="34" rx="8" fill="#fee2e2"/>
  <text x="485" y="470" class="badge-text" fill="#991b1b">N/A (No Pinning)</text>

  <rect x="685" y="448" width="130" height="34" rx="8" fill="#fee2e2"/>
  <text x="750" y="470" class="badge-text" fill="#991b1b">BYPASSED (Plaintext)</text>

  <rect x="995" y="448" width="130" height="34" rx="8" fill="#dcfce7"/>
  <text x="1060" y="470" class="badge-text" fill="#166534">PAYLOAD ENCRYPTED</text>

  <!-- Row 3: In-Flight Payload Tampering -->
  <line x1="48" y1="510" x2="1232" y2="510" stroke="#f1f5f9" stroke-width="1.5"/>
  <text x="74" y="544" class="table-text bold">3. In-flight Payload Tampering</text>
  <text x="74" y="566" class="table-subtext">Modifying JSON parameters or bodies on wire</text>

  <rect x="420" y="530" width="130" height="34" rx="8" fill="#fee2e2"/>
  <text x="485" y="552" class="badge-text" fill="#991b1b">POSSIBLE</text>

  <rect x="685" y="530" width="130" height="34" rx="8" fill="#fee2e2"/>
  <text x="750" y="552" class="badge-text" fill="#991b1b">POSSIBLE (if hooked)</text>

  <rect x="995" y="530" width="130" height="34" rx="8" fill="#dcfce7"/>
  <text x="1060" y="552" class="badge-text" fill="#166534">AES-GCM TAG VERIFIED</text>

  <!-- Row 4: Memory Hooking Inside App -->
  <line x1="48" y1="592" x2="1232" y2="592" stroke="#f1f5f9" stroke-width="1.5"/>
  <text x="74" y="626" class="table-text bold">4. In-App Runtime Memory Hooking</text>
  <text x="74" y="648" class="table-subtext">Attacker hooks methods before encryption runs</text>

  <rect x="420" y="612" width="130" height="34" rx="8" fill="#fee2e2"/>
  <text x="485" y="634" class="badge-text" fill="#991b1b">UNPROTECTED</text>

  <rect x="685" y="612" width="130" height="34" rx="8" fill="#fee2e2"/>
  <text x="750" y="634" class="badge-text" fill="#991b1b">UNPROTECTED</text>

  <rect x="995" y="612" width="130" height="34" rx="8" fill="#dcfce7"/>
  <text x="1060" y="634" class="badge-text" fill="#991b1b">UNPROTECTED</text>

  <!-- Row 5: Server Private Key Exposure -->
  <line x1="48" y1="674" x2="1232" y2="674" stroke="#f1f5f9" stroke-width="1.5"/>
  <text x="74" y="708" class="table-text bold">5. Client Binary Key Extraction</text>
  <text x="74" y="730" class="table-subtext">Decompiling app to steal master decryption key</text>

  <rect x="420" y="694" width="130" height="34" rx="8" fill="#f1f5f9"/>
  <text x="485" y="716" class="badge-text" fill="#475569">N/A (No Encryption)</text>

  <rect x="685" y="694" width="130" height="34" rx="8" fill="#f1f5f9"/>
  <text x="750" y="716" class="badge-text" fill="#475569">N/A (No Encryption)</text>

  <rect x="995" y="694" width="130" height="34" rx="8" fill="#dcfce7"/>
  <text x="1060" y="716" class="badge-text" fill="#166534">ZERO KEY IN APP</text>

  <!-- Gateway security boundary -->
  <rect x="48" y="744" width="1184" height="194" rx="18" fill="#0f172a"/>
  
  <rect x="74" y="770" width="220" height="28" rx="6" fill="#2563eb"/>
  <text x="184" y="789" class="badge-text" fill="#ffffff">SECURITY BOUNDARY</text>

  <text x="74" y="828" font-size="20" font-weight="700" fill="#f8fafc">Payload encryption does not protect a compromised client process</text>
  <text x="74" y="856" font-size="15" fill="#94a3b8">The gateway protects request and response payloads in transit. Clients decrypt data in their own process,</text>
  <text x="74" y="878" font-size="15" fill="#94a3b8">so app memory, device integrity, authentication, and authorization remain separate responsibilities.</text>
  
  <rect x="74" y="896" width="310" height="28" rx="6" fill="#1e293b"/>
  <text x="86" y="915" font-size="13" font-weight="600" fill="#38bdf8">No device attestation verification</text>

  <rect x="400" y="896" width="270" height="28" rx="6" fill="#1e293b"/>
  <text x="412" y="915" font-size="13" font-weight="600" fill="#38bdf8">No client runtime hook detection</text>

  <rect x="686" y="896" width="280" height="28" rx="6" fill="#1e293b"/>
  <text x="698" y="915" font-size="13" font-weight="600" fill="#38bdf8">Backend authorization required</text>
</svg>
